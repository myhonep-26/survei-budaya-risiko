<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Survei Budaya Risiko — PT Kereta Api Logistik</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F8;--ink:#18222F;--muted:#667085;--line:#E3E7ED;--brand:#1F3A5F;--brand2:#2D5A8C;--accent:#E07B2E;--ok:#1C7343}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,Segoe UI,Roboto,sans-serif;font-size:15.5px;line-height:1.5}
.top{background:var(--brand);color:#fff;padding:14px 16px}
.top .wrap{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.top b{font-size:15px;letter-spacing:.3px}.top small{display:block;opacity:.8;font-size:12px}
.prog{height:4px;background:rgba(255,255,255,.15)}.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
main{max-width:720px;margin:0 auto;padding:18px 16px 110px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
h1{font-size:22px;margin:0 0 8px;color:var(--brand);font-weight:800}
h2{font-size:13px;margin:0 0 14px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
p{margin:0 0 12px}
.note{background:#F2F6FB;border:1px solid #D6E2F0;border-radius:12px;padding:12px 14px;font-size:14px;margin:14px 0}
.note b{color:var(--brand)}
.q{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;transition:border .2s}
.q.miss{border-color:#E5A79B;box-shadow:0 0 0 3px rgba(168,50,31,.08)}
.q .t{font-weight:600;margin-bottom:12px}
.q .t span{color:var(--muted);font-weight:700;font-size:12px;margin-right:6px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1.5px solid #D0D5DD;background:#fff;border-radius:10px;padding:10px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;color:#344054}
.scale button b{font-size:17px}
.scale button small{font-size:10.5px;line-height:1.2;text-align:center;color:var(--muted)}
.scale button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.scale button.on small{color:#D6E2F0}
.na{margin-top:8px;width:100%;border:1.5px dashed #D0D5DD;background:#fff;border-radius:10px;padding:9px;font:inherit;font-size:13.5px;color:#475467;cursor:pointer}
.na.on{background:#475467;border-color:#475467;color:#fff;border-style:solid}
textarea{width:100%;border:1px solid #D0D5DD;border-radius:10px;padding:12px;font:inherit;resize:vertical;min-height:110px;outline:none}
textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(45,90,140,.15)}
.tbar{position:sticky;top:0;z-index:5;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.tbar b{font-size:20px;font-variant-numeric:tabular-nums}.tbar .low{color:#A8321F}
.tq .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid #D0D5DD;background:#fff;border-radius:10px;padding:10px 12px;margin-top:8px;font:inherit;color:#344054;cursor:pointer}
.tq .opt b{min-width:20px}.tq .opt.on{background:var(--brand);border-color:var(--brand);color:#fff}
.prg{display:flex;gap:8px;margin:12px 0}.prg span{flex:1;height:8px;border-radius:6px;background:#E3E7ED}.prg span.ok{background:var(--ok)}
.tesmode main{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wm{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden;opacity:.09;display:flex;flex-wrap:wrap;align-content:flex-start;transform:rotate(-24deg) scale(1.6);transform-origin:center}
.wm span{font-size:14px;font-weight:700;color:#1F3A5F;padding:26px 30px;white-space:nowrap}
.pledge{display:flex;gap:10px;align-items:flex-start;background:#FFF8EC;border:1px solid #F1D48A;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px;cursor:pointer}
.pledge input{width:20px;height:20px;margin-top:2px;flex:none}
.tnote{font-size:12px;color:var(--muted)}
@media print{body{display:none}}
.score{font-size:56px;font-weight:800;color:var(--brand);line-height:1}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .wrap{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.primary{background:var(--brand);color:#fff;flex:1}
.btn.ghost{background:#F2F4F7;color:#344054}
.btn:disabled{opacity:.5}
.err{color:#A8321F;font-size:13.5px;margin-top:8px;min-height:18px}
.center{text-align:center;padding:40px 20px}
.big{font-size:44px;line-height:1;margin-bottom:10px}
.muted{color:var(--muted)}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:-4px 0 14px}
@media(max-width:420px){.scale button small{font-size:9.5px}}
</style>
</head>
<body>
<div class="top"><div class="wrap"><div><b>SURVEI BUDAYA RISIKO</b><small>PT Kereta Api Logistik</small></div><small id="step"></small></div></div>
<div class="prog"><i id="pbar"></i></div>
<main id="main"><div class="card center"><p class="muted">Memuat survei…</p></div></main>
<div class="bar" id="bar" style="display:none"><div class="wrap">
  <button class="btn ghost" id="back">Kembali</button>
  <button class="btn primary" id="next">Lanjut</button>
</div></div>

<script>
/* ===== PENGATURAN: tempel URL Web App (/exec) dari Apps Script ===== */
var API_URL = 'https://script.google.com/macros/s/AKfycbzO-xScwvj8tZubIOpAPhdTEGRazhWwNZZGNt_8HAfxJQLgiuQN-zZzNuHfCcG1VHTh/exec';
/* =================================================================== */
var TES = (new URLSearchParams(location.search).get('tes') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 40);
var TOKEN = (new URLSearchParams(location.search).get('t') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 40);
function api(body) {
  // Content-Type text/plain agar tidak memicu preflight CORS; Apps Script mengembalikan JSON
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
var LBL = ['Sangat Tidak Setuju', 'Tidak Setuju', 'Netral', 'Setuju', 'Sangat Setuju'];
var S = { ins: null, page: -1, pages: [], ans: {}, o1: '', o2: '' };
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function save() { try { localStorage.setItem('sbr_' + TOKEN, JSON.stringify({ ans: S.ans, o1: S.o1, o2: S.o2, page: S.page })); } catch (e) {} }
function restore() { try { var d = JSON.parse(localStorage.getItem('sbr_' + TOKEN) || 'null'); if (d) { S.ans = d.ans || {}; S.o1 = d.o1 || ''; S.o2 = d.o2 || ''; return d.page; } } catch (e) {} return -1; }
function clearSaved() { try { localStorage.removeItem('sbr_' + TOKEN); } catch (e) {} }
function msg(icon, title, text) {
  $('#bar').style.display = 'none'; $('#step').textContent = '';
  $('#main').innerHTML = '<div class="card center"><div class="big">' + icon + '</div><h1>' + esc(title) + '</h1><p class="muted">' + esc(text) + '</p></div>';
}

if (TES) tesBoot(); else (TOKEN ? api({ aksi: 'init', t: TOKEN }) : Promise.resolve({ ok: false, pesan: 'Tautan survei tidak lengkap. Pastikan Anda membuka tautan dari email undangan.' })).then(function (r) {
  if (r.error) throw new Error(r.error);
  if (!r.ok) { msg(r.selesai ? '✓' : 'ⓘ', r.selesai ? 'Terima kasih' : 'Survei tidak tersedia', r.pesan); return; }
  S.ins = r.instrumen; S.periode = r.periode; S.selesai = r.selesai;
  // satu halaman per aspek, halaman terakhir = pertanyaan terbuka
  S.ins.aspek.forEach(function (a) {
    var items = S.ins.butir.filter(function (b) { return b.aspek === a.kode; });
    if (items.length) S.pages.push({ type: 'likert', items: items });
  });
  S.pages.push({ type: 'open' });
  var p = restore();
  if (p >= 0 && p < S.pages.length) { S.page = p; render(); } else intro();
}).catch(function (e) { msg('!', 'Terjadi kendala', 'Tidak dapat memuat survei. Periksa koneksi internet lalu muat ulang halaman ini.'); });

function intro() {
  S.page = -1;
  $('#step').textContent = ''; $('#pbar').style.width = '0';
  $('#main').innerHTML = '<div class="card"><h2>Periode ' + esc(S.periode) + '</h2><h1>Survei Budaya Risiko</h1>' +
    '<p>Bapak/Ibu yang kami hormati,</p>' +
    '<p>Unit Manajemen Risiko mengundang Anda mengisi Survei Budaya Risiko KALOG. Survei ini mengukur bagaimana manajemen risiko dijalankan dalam pekerjaan sehari-hari, dan hasilnya digunakan untuk menyusun program budaya risiko tahun depan.</p>' +
    '<p><b>Tidak ada jawaban benar atau salah.</b> Jawablah sesuai yang Anda alami, bukan yang seharusnya.</p>' +
    '<div class="note"><b>Anonim.</b> Jawaban Anda tidak disimpan bersama nama atau email, dan hasil hanya dilaporkan per kelompok minimal 5 orang.</div>' +
    '<p class="muted">Waktu pengisian ±10 menit · ' + S.ins.butir.length + ' pernyataan dan ' + S.ins.terbuka.length + ' pertanyaan terbuka · Batas pengisian ' + esc(S.selesai) + '. Jawaban tersimpan otomatis di perangkat ini bila Anda berhenti sejenak.</p></div>';
  $('#bar').style.display = 'block'; $('#back').style.display = 'none'; $('#next').textContent = 'Mulai';
}

function render() {
  var pg = S.pages[S.page], total = S.pages.length;
  $('#step').textContent = 'Bagian ' + (S.page + 1) + ' dari ' + total;
  $('#pbar').style.width = Math.round(S.page / total * 100) + '%';
  $('#back').style.display = 'inline-block';
  $('#next').textContent = S.page === total - 1 ? 'Kirim Jawaban' : 'Lanjut';
  var h = '';
  if (pg.type === 'likert') {
    h += '<h2>Bagian ' + (S.page + 1) + '</h2><div class="legend"><span>1 = Sangat Tidak Setuju</span><span>5 = Sangat Setuju</span></div>';
    pg.items.forEach(function (b) {
      var v = S.ans[b.kode];
      h += '<div class="q" id="q_' + b.kode + '"><div class="t">' + esc(b.teks) + '</div><div class="scale">' +
        [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-k="' + b.kode + '" data-v="' + n + '" class="' + (v === n ? 'on' : '') + '"><b>' + n + '</b><small>' + LBL[n - 1] + '</small></button>'; }).join('') + '</div>' +
        (b.na ? '<button type="button" class="na' + (v === 0 ? ' on' : '') + '" data-k="' + b.kode + '" data-v="0">Saya belum pernah mengikuti pelatihan manajemen risiko</button>' : '') + '</div>';
    });
  } else {
    h += '<h2>Bagian terakhir</h2><div class="card"><p><b>' + esc(S.ins.terbuka[0].teks) + '</b></p><textarea id="o1" maxlength="1500" placeholder="Tuliskan pendapat Anda (opsional)">' + esc(S.o1) + '</textarea>' +
      '<p style="margin-top:16px"><b>' + esc(S.ins.terbuka[1].teks) + '</b></p><textarea id="o2" maxlength="1500" placeholder="Tuliskan usulan Anda (opsional)">' + esc(S.o2) + '</textarea>' +
      '<p class="muted" style="font-size:13px;margin-top:10px">Mohon tidak menuliskan nama atau informasi yang dapat mengidentifikasi Anda maupun orang lain.</p><div class="err" id="err"></div></div>';
  }
  $('#main').innerHTML = h;
  window.scrollTo(0, 0);
  if (pg.type === 'open') {
    $('#o1').addEventListener('input', function (e) { S.o1 = e.target.value; save(); });
    $('#o2').addEventListener('input', function (e) { S.o2 = e.target.value; save(); });
  }
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-k]'); if (!b) return;
  var k = b.getAttribute('data-k'), v = Number(b.getAttribute('data-v'));
  S.ans[k] = v; save();
  var q = $('#q_' + k);
  q.classList.remove('miss');
  q.querySelectorAll('[data-k]').forEach(function (x) { x.classList.toggle('on', Number(x.getAttribute('data-v')) === v); });
});

$('#back').addEventListener('click', function () { if (S.page <= 0) intro(); else { S.page--; save(); render(); } });
$('#next').addEventListener('click', function () {
  if (S.page === -1) { S.page = 0; save(); render(); return; }
  var pg = S.pages[S.page];
  if (pg.type === 'likert') {
    var miss = pg.items.filter(function (b) { return S.ans[b.kode] === undefined; });
    if (miss.length) {
      miss.forEach(function (b) { $('#q_' + b.kode).classList.add('miss'); });
      $('#q_' + miss[0].kode).scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    S.page++; save(); render(); return;
  }
  // kirim
  var btn = $('#next'); btn.disabled = true; btn.textContent = 'Mengirim…';
  api({ aksi: 'kirim', t: TOKEN, jawaban: S.ans, o1: S.o1, o2: S.o2 }).then(function (r) {
    if (!r.ok) throw new Error(r.error || 'Gagal mengirim.');
    clearSaved(); $('#pbar').style.width = '100%';
    msg('✓', 'Terima kasih', 'Jawaban Anda telah kami terima. Partisipasi Anda membantu memperkuat budaya risiko di KALOG.');
    if (r.tes) {
      $('#main').insertAdjacentHTML('beforeend', '<div class="card" style="margin-top:14px"><h2>Langkah berikutnya</h2><h1 style="font-size:19px">Tes Pemahaman Manajemen Risiko</h1>' +
        '<p>Bagian survei (anonim) telah selesai. Anda juga terdaftar sebagai peserta <b>Tes Pemahaman Manajemen Risiko</b>. Berbeda dengan survei, tes ini dinilai per peserta.</p>' +
        '<p class="muted" style="font-size:14px">3 sesi × 10 soal, 12 menit per sesi. Anda dapat mengerjakannya sekarang atau nanti melalui tautan yang sama yang juga akan dikirim lewat email.</p>' +
        '<a class="btn primary" style="display:block;text-align:center;text-decoration:none" href="?tes=' + encodeURIComponent(r.tes) + '">Lanjut ke Tes Pemahaman</a></div>');
    }
  }).catch(function (er) {
    btn.disabled = false; btn.textContent = 'Kirim Jawaban';
    var m = String((er && er.message) || er).replace(/^Error:\s*/, '');
    if (/fetch|HTTP|network|Load failed/i.test(m)) m = 'Koneksi terputus.';
    var el = $('#err'); if (el) el.textContent = m + ' Jawaban Anda masih tersimpan di perangkat ini; silakan coba kirim lagi.';
  });
});

/* =================== TES PEMAHAMAN MANAJEMEN RISIKO =================== */
var T = { st: null, ans: {}, timer: null, end: 0, kirim: false, antre: {} };
function tesHeader() {
  document.querySelector('.top b').textContent = 'TES PEMAHAMAN MANAJEMEN RISIKO'; document.title = 'Tes Pemahaman Manajemen Risiko — PT Kereta Api Logistik';
  document.body.classList.add('tesmode');
  // A. Mempersulit penyalinan soal (tidak dapat mencegah foto layar; fungsi utamanya efek jera)
  ['copy', 'cut', 'contextmenu', 'selectstart', 'dragstart'].forEach(function (ev) { document.addEventListener(ev, function (e) { if (!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); }); });
  document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && /^[cxpsau]$/i.test(e.key)) e.preventDefault(); });
  // B. Pencatatan meninggalkan halaman selama sesi berjalan (pindah tab/aplikasi/jendela)
  var pergi = 0;
  function keluar() { if (T.sesiAktif && !pergi) pergi = Date.now(); }
  function kembali() {
    if (!pergi || document.hidden || !document.hasFocus()) return;
    var d = Math.round((Date.now() - pergi) / 100) / 10; pergi = 0;
    if (!T.sesiAktif || d < 1) return;
    api({ aksi: 'tesKeluar', tes: TES, detik: d }).then(function (r) { if (r && r.n) tesInfo('Tercatat meninggalkan halaman tes (' + r.n + ' kali pada sesi ini).'); }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) keluar(); else kembali(); });
  window.addEventListener('blur', keluar); window.addEventListener('focus', kembali);
}
function tesInfo(t) { var el = $('#tinfo'); if (el) { el.textContent = t; el.style.color = '#A8321F'; } }
function tesWatermark(st) {
  if ($('.wm')) return;
  var lbl = esc(st.nama) + ' · ' + esc(st.email || ''), h = '';
  for (var i = 0; i < 90; i++) h += '<span>' + lbl + '</span>';
  document.body.insertAdjacentHTML('beforeend', '<div class="wm" aria-hidden="true">' + h + '</div>');
}
function tesBoot() {
  tesHeader(); $('#bar').style.display = 'none';
  api({ aksi: 'tesInit', tes: TES }).then(tesRender).catch(function () { msg('!', 'Terjadi kendala', 'Tidak dapat memuat tes. Periksa koneksi internet lalu muat ulang halaman ini.'); });
}
function tesProg(st) { var h = '<div class="prg">'; for (var i = 1; i <= st.sesiTotal; i++) h += '<span class="' + (i <= st.sesiSelesai ? 'ok' : '') + '"></span>'; return h + '</div>'; }
function tesRender(st) {
  if (st.error) { msg('!', 'Terjadi kendala', st.error); return; }
  if (st.perluIntegritas) { var te = $('#terr'); if (te) te.textContent = st.pesan; if ($('#tmulai')) { $('#tmulai').disabled = false; $('#tmulai').textContent = 'Mulai Sesi'; } return; }
  if (!st.ok) { msg('ⓘ', 'Tes tidak tersedia', st.pesan); return; }
  T.st = st; clearInterval(T.timer); T.sesiAktif = !!st.aktif; tesWatermark(st);
  $('#step').textContent = st.status === 'Selesai' ? 'Selesai' : 'Sesi ' + (st.aktif ? st.aktif.sesi : Math.min(st.sesiSelesai + 1, st.sesiTotal)) + ' dari ' + st.sesiTotal;
  $('#pbar').style.width = Math.round(st.sesiSelesai / st.sesiTotal * 100) + '%';
  if (st.status === 'Selesai') {
    $('#main').innerHTML = '<div class="card center"><h2>Tes selesai</h2><div class="score">' + String(st.nilai).replace('.', ',') + '</div><p class="muted" style="margin-top:8px">Nilai Anda (skala 0–100) · ' + st.benar + ' dari ' + st.jumlahSoal + ' soal benar</p>' +
      '<div class="note" style="text-align:left">' + (st.memadai ? '<b>Memadai.</b> Nilai Anda mencapai batas ' + st.batas + '.' : '<b>Belum mencapai batas ' + st.batas + '.</b> Hasil ini dipakai Unit Manajemen Risiko untuk menyusun program penguatan pemahaman, bukan untuk penilaian kinerja.') + '</div>' +
      '<p class="muted" style="font-size:13.5px">Terima kasih atas partisipasi Anda. Kunci jawaban tidak ditampilkan untuk menjaga kerahasiaan soal.</p></div>';
    return;
  }
  if (st.aktif) { tesSesi(st.aktif); return; }
  var next = st.sesiSelesai + 1;
  $('#main').innerHTML = '<div class="card"><h2>' + (st.sesiSelesai ? 'Lanjutkan tes' : 'Tes Pemahaman Manajemen Risiko') + '</h2><h1>' + esc(st.nama) + '</h1>' + tesProg(st) +
    (st.sesiSelesai ? '<p><b>' + st.sesiSelesai + ' dari ' + st.sesiTotal + ' sesi selesai.</b> Anda dapat melanjutkan sekarang atau nanti melalui tautan yang sama' + (st.batasWaktu ? ' sampai ' + esc(st.batasWaktu) : '') + '.</p>'
      : '<p>Tes ini mengukur pemahaman manajemen risiko jajaran manajer, sebagai dasar program penguatan kapabilitas risiko perusahaan.</p>') +
    '<div class="note"><b>Ketentuan</b><br>• ' + st.sesiTotal + ' sesi × ' + st.perSesi + ' soal pilihan ganda (A–E), <b>' + st.menit + ' menit per sesi</b>.<br>• Waktu sesi berjalan terus sejak sesi dimulai, termasuk bila halaman ditutup.<br>• Jeda hanya dapat dilakukan <b>di antara sesi</b>. Jawaban sesi yang sudah dikirim tidak dapat diubah.<br>• Soal dan urutan pilihan berbeda untuk setiap peserta. Soal tidak dapat disalin.<br>• Selama sesi berjalan, <b>setiap kali Anda meninggalkan halaman tes</b> (pindah tab, aplikasi, atau jendela) <b>dicatat</b> oleh sistem.</div>' +
    (st.integritas ? '' : '<label class="pledge"><input type="checkbox" id="tjanji"><span><b>Pernyataan integritas.</b> Saya akan mengerjakan tes ini secara mandiri, tanpa bantuan orang lain maupun alat bantu kecerdasan buatan (AI), dan tidak menyebarkan soal kepada pihak lain.</span></label>') +
    '<button class="btn primary" style="width:100%" id="tmulai"' + (st.integritas ? '' : ' disabled') + '>Mulai Sesi ' + next + '</button><div class="err" id="terr"></div></div>';
  if ($('#tjanji')) $('#tjanji').onchange = function () { $('#tmulai').disabled = !this.checked; };
  $('#tmulai').onclick = function () {
    if (!confirm('Mulai Sesi ' + next + '? Waktu ' + st.menit + ' menit akan berjalan dan tidak dapat dihentikan.')) return;
    this.disabled = true; this.textContent = 'Memuat soal…';
    api({ aksi: 'tesMulai', tes: TES, setuju: !!($('#tjanji') && $('#tjanji').checked) }).then(tesRender).catch(function () { $('#terr').textContent = 'Koneksi terputus. Coba lagi.'; $('#tmulai').disabled = false; $('#tmulai').textContent = 'Mulai Sesi ' + next; });
  };
}
function tesSesi(a) {
  T.ans = {}; a.soal.forEach(function (q) { if (q.pilih) T.ans[q.kode] = q.pilih; });
  T.end = Date.now() + a.sisaDetik * 1000; T.kirim = false;
  var h = '<div class="tbar"><span>Sesi ' + a.sesi + ' dari ' + T.st.sesiTotal + '<div class="tnote" id="tinfo">Meninggalkan halaman tercatat</div></span><span>Sisa waktu <b id="tclock">--:--</b></span></div>';
  a.soal.forEach(function (q) {
    h += '<div class="q tq" id="tq_' + q.kode + '"><div class="t"><span>' + q.no + '.</span>' + esc(q.teks) + '</div>' +
      q.opsi.map(function (o, i) { return '<button type="button" class="opt' + (T.ans[q.kode] === o.id ? ' on' : '') + '" data-tk="' + q.kode + '" data-tv="' + o.id + '"><b>' + 'ABCDE'[i] + '.</b><span>' + esc(o.teks) + '</span></button>'; }).join('') + '</div>';
  });
  h += '<div class="card"><p class="muted" style="font-size:14px;margin:0 0 10px">Jawaban tersimpan otomatis setiap kali Anda memilih. Klik tombol di bawah setelah selesai; sesi juga dikirim otomatis saat waktu habis.</p><button class="btn primary" style="width:100%" id="tkirim">Kirim Sesi ' + a.sesi + '</button><div class="err" id="terr"></div></div>';
  $('#main').innerHTML = h; window.scrollTo(0, 0);
  document.querySelectorAll('[data-tk]').forEach(function (b) { b.onclick = function () {
    if (T.kirim) return;
    var k = b.getAttribute('data-tk'), v = b.getAttribute('data-tv'); T.ans[k] = v;
    document.querySelectorAll('[data-tk="' + k + '"]').forEach(function (x) { x.classList.toggle('on', x === b); });
    T.antre[k] = v; api({ aksi: 'tesJawab', tes: TES, kode: k, pilih: v }).then(function (r) { if (r.ok && T.antre[k] === v) delete T.antre[k]; if (r.habis) tesKirim(true); }).catch(function () {});
  }; });
  $('#tkirim').onclick = function () {
    var kosong = a.soal.filter(function (q) { return !T.ans[q.kode]; }).length;
    if (!confirm(kosong ? kosong + ' soal belum dijawab dan akan dinilai salah. Kirim Sesi ' + a.sesi + '?' : 'Kirim Sesi ' + a.sesi + '? Jawaban tidak dapat diubah setelah dikirim.')) return;
    tesKirim(false);
  };
  function tick() {
    var d = Math.max(0, Math.round((T.end - Date.now()) / 1000)), el = $('#tclock'); if (!el) return clearInterval(T.timer);
    el.textContent = Math.floor(d / 60) + ':' + ('0' + d % 60).slice(-2); el.classList.toggle('low', d <= 60);
    if (d <= 0) tesKirim(true);
  }
  tick(); T.timer = setInterval(tick, 1000);
}
function tesKirim(otomatis) {
  if (T.kirim) return; T.kirim = true; clearInterval(T.timer); T.sesiAktif = false;
  var b = $('#tkirim'); if (b) { b.disabled = true; b.textContent = otomatis ? 'Waktu habis, mengirim…' : 'Mengirim…'; }
  var coba = 0;
  (function go() {
    api({ aksi: 'tesSelesaiSesi', tes: TES, jawaban: T.ans }).then(tesRender).catch(function () {
      if (++coba < 4) return setTimeout(go, 2500);
      var e = $('#terr'); if (e) e.textContent = 'Koneksi terputus. Jawaban yang sudah dipilih telah tersimpan otomatis. Muat ulang halaman ini untuk melanjutkan.';
    });
  })();
}
</script>
